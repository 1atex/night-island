name: Browser integration
on:
  workflow_dispatch:
  push:
    branches: [feature/browser-downloads]
    tags: ["v*-browser-preview.*"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Island
        run: cargo test --locked --features demo
      - name: Build Island
        run: cargo build --locked --release --bin night-island
      - name: Hash binary
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/night-island.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  night-island.exe" | Set-Content target/release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: night-island-browser-preview
          path: |
            target/release/night-island.exe
            target/release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: night-island-browser-preview
          path: release-assets
      - name: Publish tested preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/night-island.exe release-assets/SHA256SUMS.txt \
            --verify-tag --prerelease --title "Night Island $RELEASE_TAG" --notes-file docs/browser-integration.md
