name: Feature request / Предложение
description: Suggest an idea / Предложить идею
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Какая задача решается
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution / Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / Альтернативы
