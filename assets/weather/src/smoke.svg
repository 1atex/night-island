<svg xmlns="http://www.w3.org/2000/svg" class="wx-smoke" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-smoke-title wx-smoke-desc">
<title id="wx-smoke-title">Дым</title>
<desc id="wx-smoke-desc">Три серо-лиловые струи дыма медленно поднимаются.</desc>
<defs><style>.wx-smoke .smoke-line{animation:wx-smoke-smoke 5s ease-in-out infinite}@keyframes wx-smoke-smoke{0%{transform:translateY(1px);opacity:0}22%{opacity:.65}72%{opacity:.65}100%{transform:translateY(-1.5px);opacity:0}}@media(prefers-reduced-motion:reduce){.wx-smoke *{animation:none!important}.wx-smoke .drop,.wx-smoke .flake,.wx-smoke .hail{opacity:.85}.wx-smoke .bolt{opacity:1}.wx-smoke .wind-line,.wx-smoke .funnel-line{stroke-dasharray:none}}</style></defs>
<path d="M6 20c-3-3 3-4 0-7s3-4 0-8" stroke="#A4AABD" stroke-width="1.25" stroke-linecap="round" class="smoke-line" style="animation-delay:-0.0s"/><path d="M12 20c-3-3 3-4 0-7s3-4 0-8" stroke="#A4AABD" stroke-width="1.25" stroke-linecap="round" class="smoke-line" style="animation-delay:-1.4s"/><path d="M18 20c-3-3 3-4 0-7s3-4 0-8" stroke="#A4AABD" stroke-width="1.25" stroke-linecap="round" class="smoke-line" style="animation-delay:-2.8s"/>
</svg>
