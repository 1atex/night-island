<svg xmlns="http://www.w3.org/2000/svg" class="wx-sunrise" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-sunrise-title wx-sunrise-desc">
<title id="wx-sunrise-title">Восход</title>
<desc id="wx-sunrise-desc">Солнце медленно поднимается у линии горизонта.</desc>
<defs><linearGradient id="wx-sunrise-sun" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#FFE5A4"/><stop offset="1" stop-color="#F5BD55"/></linearGradient><clipPath id="wx-sunrise-horizon"><path d="M0 0h24v15.6H0Z"/></clipPath><style>.wx-sunrise .rays{animation:wx-sunrise-turn 90s linear infinite}.wx-sunrise .sun-disc{animation:wx-sunrise-breathe 10s ease-in-out infinite}.wx-sunrise .rise{animation:wx-sunrise-rise 12s cubic-bezier(.4,0,.6,1) infinite}@keyframes wx-sunrise-turn{to{transform:rotate(360deg)}}@keyframes wx-sunrise-breathe{0%,100%{opacity:1}50%{opacity:.96}}@keyframes wx-sunrise-rise{0%{transform:translateY(3px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(-.6px);opacity:0}}@media(prefers-reduced-motion:reduce){.wx-sunrise *{animation:none!important}.wx-sunrise .drop,.wx-sunrise .flake,.wx-sunrise .hail{opacity:.85}.wx-sunrise .bolt{opacity:1}.wx-sunrise .wind-line,.wx-sunrise .funnel-line{stroke-dasharray:none}}</style></defs>
<g clip-path="url(#wx-sunrise-horizon)"><g class="rise"><g style="transform-origin:12px 15px" class="rays"><path d="M17.500 15.000l1.500 0.000" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M15.889 18.889l1.061 1.061" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M12.000 20.500l0.000 1.500" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M8.111 18.889l-1.061 1.061" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M6.500 15.000l-1.500 0.000" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M8.111 11.111l-1.061 -1.061" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M12.000 9.500l-0.000 -1.500" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M15.889 11.111l1.061 -1.061" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/></g><circle class="sun-disc" cx="12" cy="15" r="4" fill="url(#wx-sunrise-sun)" stroke="#F3B747" stroke-width=".55"/></g></g><path d="M2.5 16H21.5M6 19.5H18" stroke="#A8BCD0" stroke-width=".9" stroke-linecap="round"/><path d="M12 5v5m-2-3 2-2 2 2" stroke="#D6A563" stroke-width=".75" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
