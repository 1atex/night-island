<svg xmlns="http://www.w3.org/2000/svg" class="wx-hot" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-hot-title wx-hot-desc">
<title id="wx-hot-title">Жара</title>
<desc id="wx-hot-desc">Коралловый термометр, солнце и волны горячего воздуха.</desc>
<defs><linearGradient id="wx-hot-sun" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#FFE5A4"/><stop offset="1" stop-color="#F5BD55"/></linearGradient><style>.wx-hot .rays{animation:wx-hot-turn 90s linear infinite}.wx-hot .sun-disc{animation:wx-hot-breathe 10s ease-in-out infinite}.wx-hot .heat-line{animation:wx-hot-heat 3s ease-in-out infinite}@keyframes wx-hot-turn{to{transform:rotate(360deg)}}@keyframes wx-hot-breathe{0%,100%{opacity:1}50%{opacity:.96}}@keyframes wx-hot-heat{0%,100%{transform:translateY(.3px);opacity:.5}50%{transform:translateY(-.5px);opacity:.95}}@media(prefers-reduced-motion:reduce){.wx-hot *{animation:none!important}.wx-hot .drop,.wx-hot .flake,.wx-hot .hail{opacity:.85}.wx-hot .bolt{opacity:1}.wx-hot .wind-line,.wx-hot .funnel-line{stroke-dasharray:none}}</style></defs>
<path d="M10 5a2 2 0 0 1 4 0v9.3a4 4 0 1 1-4 0Z" fill="#EFF6FB" stroke="#9EBBD1" stroke-width=".7" stroke-linejoin="round"/><path d="M12 7v10.3" stroke="#F19A6D" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="18" r="2.25" fill="#F19A6D"/><g transform="translate(3.7 1.2) scale(.8)"><g style="transform-origin:18.4px 5.1px" class="rays"><path d="M21.250 5.100l1.500 0.000" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M20.415 7.115l1.061 1.061" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M18.400 7.950l0.000 1.500" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M16.385 7.115l-1.061 1.061" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M15.550 5.100l-1.500 0.000" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M16.385 3.085l-1.061 -1.061" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M18.400 2.250l-0.000 -1.500" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M20.415 3.085l1.061 -1.061" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/></g><circle class="sun-disc" cx="18.4" cy="5.1" r="1.35" fill="url(#wx-hot-sun)" stroke="#F3B747" stroke-width=".55"/></g><path d="M5.2 8c-1.5 1.4 1.5 2.3 0 3.8M5.3 15c-1.5 1.4 1.5 2.3 0 3.8" stroke="#E9AC83" stroke-width=".7" stroke-linecap="round" class="heat-line"/>
</svg>
