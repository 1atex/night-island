<svg xmlns="http://www.w3.org/2000/svg" class="wx-snow-showers-night" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-snow-showers-night-title wx-snow-showers-night-desc">
