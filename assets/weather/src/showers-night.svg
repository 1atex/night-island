<svg xmlns="http://www.w3.org/2000/svg" class="wx-showers-night" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-showers-night-title wx-showers-night-desc">
<title id="wx-showers-night-title">Кратковременный дождь · ночь</title>
<desc id="wx-showers-night-desc">Дождь с просветами ночного неба.</desc>
