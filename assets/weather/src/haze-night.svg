<svg xmlns="http://www.w3.org/2000/svg" class="wx-haze-night" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-haze-night-title wx-haze-night-desc">
<title id="wx-haze-night-title">Мгла · ночь</title>
<desc id="wx-haze-night-desc">Тёплая пелена мягко движется перед месяцем.</desc>
<defs><linearGradient id="wx-haze-night-moon" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#EAE7FC"/><stop offset="1" stop-color="#BCB4E7"/></linearGradient><style>.wx-haze-night .fog-line{animation:wx-haze-night-mist 8.4s ease-in-out infinite}.wx-haze-night .fog-line.alt{animation-duration:10.2s;animation-delay:-4.3s}@keyframes wx-haze-night-mist{0%,100%{transform:translateX(-.5px);opacity:.6}50%{transform:translateX(.7px);opacity:.95}}@media(prefers-reduced-motion:reduce){.wx-haze-night *{animation:none!important}.wx-haze-night .drop,.wx-haze-night .flake,.wx-haze-night .hail{opacity:.85}.wx-haze-night .bolt{opacity:1}.wx-haze-night .wind-line,.wx-haze-night .funnel-line{stroke-dasharray:none}}</style></defs>
<g opacity=".75"><g class="moon"><path d="M14.060 5.580A4.5 4.5 0 1 0 14.150 12.240A3.8249999999999997 3.8249999999999997 0 0 1 14.060 5.580Z" fill="url(#wx-haze-night-moon)" stroke="#AAA2D6" stroke-width=".55" stroke-linejoin="round"/></g></g><path d="M3.5 12H20.5" stroke="#CCB99F" stroke-width=".95" stroke-linecap="round" class="fog-line"/><path d="M5 15.5H18" stroke="#CCB99F" stroke-width=".95" stroke-linecap="round" class="fog-line alt"/><path d="M3 19H20" stroke="#CCB99F" stroke-width=".95" stroke-linecap="round" class="fog-line"/>
</svg>
