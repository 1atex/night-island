<svg xmlns="http://www.w3.org/2000/svg" class="wx-fog-night" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-fog-night-title wx-fog-night-desc">
<title id="wx-fog-night-title">Туман · ночь</title>
<desc id="wx-fog-night-desc">Полосы тумана закрывают месяц.</desc>
<defs><linearGradient id="wx-fog-night-moon" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#EAE7FC"/><stop offset="1" stop-color="#BCB4E7"/></linearGradient><style>.wx-fog-night .fog-line{animation:wx-fog-night-mist 8.4s ease-in-out infinite}.wx-fog-night .fog-line.alt{animation-duration:10.2s;animation-delay:-4.3s}@keyframes wx-fog-night-mist{0%,100%{transform:translateX(-.5px);opacity:.6}50%{transform:translateX(.7px);opacity:.95}}@media(prefers-reduced-motion:reduce){.wx-fog-night *{animation:none!important}.wx-fog-night .drop,.wx-fog-night .flake,.wx-fog-night .hail{opacity:.85}.wx-fog-night .bolt{opacity:1}.wx-fog-night .wind-line,.wx-fog-night .funnel-line{stroke-dasharray:none}}</style></defs>
<g opacity=".7"><g class="moon"><path d="M14.060 5.580A4.5 4.5 0 1 0 14.150 12.240A3.8249999999999997 3.8249999999999997 0 0 1 14.060 5.580Z" fill="url(#wx-fog-night-moon)" stroke="#AAA2D6" stroke-width=".55" stroke-linejoin="round"/></g></g><path d="M4 13.5H20" stroke="#A5BBD0" stroke-width=".95" stroke-linecap="round" class="fog-line"/><path d="M2.5 17H18" stroke="#A5BBD0" stroke-width=".95" stroke-linecap="round" class="fog-line alt"/><path d="M6 20.5H21.2" stroke="#A5BBD0" stroke-width=".95" stroke-linecap="round" class="fog-line"/>
</svg>
