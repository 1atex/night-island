<svg xmlns="http://www.w3.org/2000/svg" class="wx-wind" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-wind-title wx-wind-desc">
<title id="wx-wind-title">Ветер</title>
<desc id="wx-wind-desc">Три воздушных потока плавно меняют силу.</desc>
<defs><style>.wx-wind .wind-line{animation:wx-wind-flow 3.6s linear infinite;stroke-dasharray:16 20}.wx-wind .wind-line.alt{animation-duration:4.7s;animation-delay:-2.1s}@keyframes wx-wind-flow{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.wx-wind *{animation:none!important}.wx-wind .drop,.wx-wind .flake,.wx-wind .hail{opacity:.85}.wx-wind .bolt{opacity:1}.wx-wind .wind-line,.wx-wind .funnel-line{stroke-dasharray:none}}</style></defs>
<g ><path d="M3 8h11a2.5 2.5 0 1 0-2.5-2.5" stroke="#91B5CE" stroke-opacity=".22" stroke-width="1.05" stroke-linecap="round"/><path d="M3 8h11a2.5 2.5 0 1 0-2.5-2.5" stroke="#91B5CE" stroke-width="1.05" stroke-linecap="round" pathLength="36" class="wind-line" style="animation-delay:-0.0s"/><path d="M2.5 12h16a2 2 0 1 0-2-2" stroke="#91B5CE" stroke-opacity=".22" stroke-width="1.05" stroke-linecap="round"/><path d="M2.5 12h16a2 2 0 1 0-2-2" stroke="#91B5CE" stroke-width="1.05" stroke-linecap="round" pathLength="36" class="wind-line alt" style="animation-delay:-1.21s"/><path d="M5 16h9a2.5 2.5 0 1 1-2.5 2.5" stroke="#91B5CE" stroke-opacity=".22" stroke-width="1.05" stroke-linecap="round"/><path d="M5 16h9a2.5 2.5 0 1 1-2.5 2.5" stroke="#91B5CE" stroke-width="1.05" stroke-linecap="round" pathLength="36" class="wind-line" style="animation-delay:-2.42s"/></g>
</svg>
