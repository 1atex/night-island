<svg xmlns="http://www.w3.org/2000/svg" class="wx-sleet" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-sleet-title wx-sleet-desc">
<title id="wx-sleet-title">Дождь со снегом</title>
<desc id="wx-sleet-desc">Чередующиеся капли дождя и снежинка.</desc>
<defs><linearGradient id="wx-sleet-rain" x1="12" y1="16" x2="12" y2="23" gradientUnits="userSpaceOnUse"><stop stop-color="#72C9EF"/><stop offset="1" stop-color="#388DDD"/></linearGradient><linearGradient id="wx-sleet-rim" x1="7.6" y1="5" x2="14" y2="5" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF" stop-opacity="0"/><stop offset=".35" stop-color="#FFF"/><stop offset=".65" stop-color="#FFF"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient><linearGradient id="wx-sleet-cloud-heavy-snow" x1="12" y1="2" x2="12" y2="15" gradientUnits="userSpaceOnUse"><stop stop-color="#C1D4E2"/><stop offset=".55" stop-color="#93AEC3"/><stop offset="1" stop-color="#6D8CA6"/></linearGradient><style>.wx-sleet .cloud-shape{animation:wx-sleet-morph var(--cloud-cycle,15.6s) cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--cloud-phase,0s)}.wx-sleet .cloud-highlight{animation:wx-sleet-highlight var(--cloud-cycle,15.6s) cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--cloud-phase,0s)}.wx-sleet .drop{animation:wx-sleet-rain var(--fall-cycle,1.65s) linear infinite}.wx-sleet .flake{animation:wx-sleet-snow var(--snow-cycle,4.6s) linear infinite}@keyframes wx-sleet-morph{0%,100%{d:path('M6.5 14.5C4.01 14.5 2 12.49 2 10C2 7.7 3.73 5.78 6.07 5.52C6.93 3.32 8.96 1.83 11.25 1.83C14.31 1.83 16.91 4.05 17.3 7C19.95 6.65 21.75 8.4 21.75 10.75C21.75 12.82 20.07 14.5 18 14.5H6.5Z')}34%{d:path('M6.5 14.5C3.94 14.5 1.83 12.47 1.83 10.1C1.83 7.84 3.78 5.61 6.28 5.62C7.12 3.28 9.29 1.63 11.65 1.63C14.61 1.63 16.85 4.11 17.1 7.23C19.64 6.83 21.93 8.49 21.93 10.77C21.93 12.85 20.11 14.5 18 14.5H6.5Z')}68%{d:path('M6.5 14.5C4.04 14.5 2.14 12.51 2.14 9.87C2.14 7.56 3.71 5.98 5.91 5.78C6.66 3.53 8.63 2.03 10.99 2.03C14.14 2.03 16.92 3.91 17.48 6.84C20.02 6.55 21.61 8.33 21.61 10.69C21.61 12.8 20.02 14.5 18 14.5H6.5Z')}}@keyframes wx-sleet-highlight{0%,100%{d:path('M8.1 6.2C9.02 4.51 11.33 3.61 13.2 4.6')}34%{d:path('M8.36 6.18C9.3 4.32 11.6 3.43 13.48 4.43')}68%{d:path('M7.88 6.36C8.79 4.74 11.1 3.84 12.99 4.76')}}@keyframes wx-sleet-rain{0%{opacity:0;transform:translate(.35px,-1.4px)}14%{opacity:.95}76%{opacity:.9}100%{opacity:0;transform:translate(-1.3px,4.4px)}}@keyframes wx-sleet-snow{0%{opacity:0;transform:translate(.3px,-.8px) rotate(-12deg)}18%{opacity:.85}35%{transform:translate(-.2px,.6px) rotate(1deg)}68%{opacity:.85;transform:translate(.1px,1.95px) rotate(17deg)}100%{opacity:0;transform:translate(-.6px,3.3px) rotate(32deg)}}@media(prefers-reduced-motion:reduce){.wx-sleet *{animation:none!important}.wx-sleet .drop,.wx-sleet .flake,.wx-sleet .hail{opacity:.85}.wx-sleet .bolt{opacity:1}.wx-sleet .wind-line,.wx-sleet .funnel-line{stroke-dasharray:none}}</style></defs>
<g stroke="url(#wx-sleet-rain)" stroke-linecap="round"><path d="M7 16.1l-0.634 1.452" class="drop" style="--fall-cycle:1.567s;animation-delay:-0.240s" stroke-width="1"/><path d="M18 16.1l-0.756 1.732" class="drop" style="--fall-cycle:1.782s;animation-delay:-0.858s" stroke-width=".86"/></g><g transform="translate(12.2 17.4)"><g style="--snow-cycle:4.18s;animation-delay:-1.1s" class="flake"><path d="M0 -1V1M-0.866 -0.500l1.732 1.000M-0.866 0.500l1.732 -1.000" stroke="#7DBCE2" stroke-width=".43" stroke-linecap="round"/></g></g><g opacity="1"><g style="--cloud-cycle:14.60s;--cloud-phase:-11.85s" class="cloud"><path d="M6.5 14.5C4.01 14.5 2 12.49 2 10C2 7.7 3.73 5.78 6.07 5.52C6.93 3.32 8.96 1.83 11.25 1.83C14.31 1.83 16.91 4.05 17.3 7C19.95 6.65 21.75 8.4 21.75 10.75C21.75 12.82 20.07 14.5 18 14.5H6.5Z" fill="url(#wx-sleet-cloud-heavy-snow)" stroke="#7698B3" stroke-width=".5" stroke-linejoin="round" class="cloud-shape"/><path d="M8.1 6.2C9.02 4.51 11.33 3.61 13.2 4.6" stroke="url(#wx-sleet-rim)" stroke-opacity=".5" stroke-width=".5" stroke-linecap="round" class="cloud-highlight"/></g></g>
