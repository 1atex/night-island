<svg xmlns="http://www.w3.org/2000/svg" class="wx-tornado" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-tornado-title wx-tornado-desc">
<title id="wx-tornado-title">Смерч</title>
<desc id="wx-tornado-desc">Воздушные потоки непрерывно проходят по виткам неподвижной воронки.</desc>
<defs><style>.wx-tornado .funnel-line{animation:wx-tornado-vortex 2.8s linear infinite;stroke-dasharray:24 8}@keyframes wx-tornado-vortex{from{stroke-dashoffset:32}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.wx-tornado *{animation:none!important}.wx-tornado .drop,.wx-tornado .flake,.wx-tornado .hail{opacity:.85}.wx-tornado .bolt{opacity:1}.wx-tornado .wind-line,.wx-tornado .funnel-line{stroke-dasharray:none}}</style></defs>
<path d="M3.5 5Q12.0 6.4 20.5 5" stroke="#A8BDCD" stroke-width="1.2" stroke-linecap="round" pathLength="32" class="funnel-line" style="animation-duration:3.40s;animation-delay:-0.0s"/><path d="M4.5 8Q12.0 9.4 19.5 8" stroke="#9BB2C6" stroke-width="1.2" stroke-linecap="round" pathLength="32" class="funnel-line" style="animation-duration:3.17s;animation-delay:-0.36s"/><path d="M6 11Q11.5 12.4 17 11" stroke="#90A9BF" stroke-width="1.2" stroke-linecap="round" pathLength="32" class="funnel-line" style="animation-duration:2.94s;animation-delay:-0.72s"/><path d="M8 14Q11.75 15.4 15.5 14" stroke="#839FB9" stroke-width="1.2" stroke-linecap="round" pathLength="32" class="funnel-line" style="animation-duration:2.71s;animation-delay:-1.08s"/><path d="M10 17Q12.0 18.4 14 17" stroke="#7996B0" stroke-width="1.2" stroke-linecap="round" pathLength="32" class="funnel-line" style="animation-duration:2.48s;animation-delay:-1.44s"/><path d="M11.5 20Q13.0 21.4 14.5 20" stroke="#7190AD" stroke-width="1.2" stroke-linecap="round" pathLength="32" class="funnel-line" style="animation-duration:2.25s;animation-delay:-1.7999999999999998s"/>
</svg>
