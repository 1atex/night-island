<svg xmlns="http://www.w3.org/2000/svg" class="wx-fog-day" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-fog-day-title wx-fog-day-desc">
<title id="wx-fog-day-title">Туман · день</title>
<desc id="wx-fog-day-desc">Полосы тумана закрывают солнце.</desc>
<defs><linearGradient id="wx-fog-day-sun" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#FFE5A4"/><stop offset="1" stop-color="#F5BD55"/></linearGradient><style>.wx-fog-day .rays{animation:wx-fog-day-turn 90s linear infinite}.wx-fog-day .sun-disc{animation:wx-fog-day-breathe 10s ease-in-out infinite}.wx-fog-day .fog-line{animation:wx-fog-day-mist 8.4s ease-in-out infinite}.wx-fog-day .fog-line.alt{animation-duration:10.2s;animation-delay:-4.3s}@keyframes wx-fog-day-turn{to{transform:rotate(360deg)}}@keyframes wx-fog-day-breathe{0%,100%{opacity:1}50%{opacity:.96}}@keyframes wx-fog-day-mist{0%,100%{transform:translateX(-.5px);opacity:.6}50%{transform:translateX(.7px);opacity:.95}}@media(prefers-reduced-motion:reduce){.wx-fog-day *{animation:none!important}.wx-fog-day .drop,.wx-fog-day .flake,.wx-fog-day .hail{opacity:.85}.wx-fog-day .bolt{opacity:1}.wx-fog-day .wind-line,.wx-fog-day .funnel-line{stroke-dasharray:none}}</style></defs>
<g opacity=".7"><g style="transform-origin:12px 9px" class="rays"><path d="M16.700 9.000l1.500 0.000" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M15.323 12.323l1.061 1.061" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M12.000 13.700l0.000 1.500" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M8.677 12.323l-1.061 1.061" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M7.300 9.000l-1.500 0.000" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M8.677 5.677l-1.061 -1.061" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M12.000 4.300l-0.000 -1.500" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/><path d="M15.323 5.677l1.061 -1.061" stroke="#F3B747" stroke-width=".95" stroke-linecap="round"/></g><circle class="sun-disc" cx="12" cy="9" r="3.2" fill="url(#wx-fog-day-sun)" stroke="#F3B747" stroke-width=".55"/></g><path d="M4 13.5H20" stroke="#A5BBD0" stroke-width=".95" stroke-linecap="round" class="fog-line"/><path d="M2.5 17H18" stroke="#A5BBD0" stroke-width=".95" stroke-linecap="round" class="fog-line alt"/><path d="M6 20.5H21.2" stroke="#A5BBD0" stroke-width=".95" stroke-linecap="round" class="fog-line"/>
</svg>
