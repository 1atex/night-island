<svg xmlns="http://www.w3.org/2000/svg" class="wx-duststorm" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-duststorm-title wx-duststorm-desc">
<title id="wx-duststorm-title">Пыльная буря</title>
<desc id="wx-duststorm-desc">Песочные потоки ветра с летящими частицами пыли.</desc>
<defs><style>.wx-duststorm .fog-line{animation:wx-duststorm-mist 8.4s ease-in-out infinite}.wx-duststorm .fog-line.alt{animation-duration:10.2s;animation-delay:-4.3s}.wx-duststorm .wind-line{animation:wx-duststorm-flow 3.6s linear infinite;stroke-dasharray:16 20}.wx-duststorm .wind-line.alt{animation-duration:4.7s;animation-delay:-2.1s}.wx-duststorm .dust-dot{animation:wx-duststorm-dust 3.8s ease-in-out infinite}@keyframes wx-duststorm-mist{0%,100%{transform:translateX(-.5px);opacity:.6}50%{transform:translateX(.7px);opacity:.95}}@keyframes wx-duststorm-flow{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}@keyframes wx-duststorm-dust{0%{opacity:0;transform:translate(-1px,.4px)}25%,70%{opacity:.8}100%{opacity:0;transform:translate(2px,-.4px)}}@media(prefers-reduced-motion:reduce){.wx-duststorm *{animation:none!important}.wx-duststorm .drop,.wx-duststorm .flake,.wx-duststorm .hail{opacity:.85}.wx-duststorm .bolt{opacity:1}.wx-duststorm .wind-line,.wx-duststorm .funnel-line{stroke-dasharray:none}}</style></defs>
<path d="M3 9H17" stroke="#C2A17A" stroke-width=".95" stroke-linecap="round" class="fog-line"/><path d="M6 13H21" stroke="#C2A17A" stroke-width=".95" stroke-linecap="round" class="fog-line alt"/><path d="M3 17H16" stroke="#C2A17A" stroke-width=".95" stroke-linecap="round" class="fog-line"/><circle class="dust-dot" cx="5" cy="5" r=".45" fill="#C2A17A" style="animation-delay:-0.0s"/><circle class="dust-dot" cx="14" cy="5.5" r=".45" fill="#C2A17A" style="animation-delay:-0.43s"/><circle class="dust-dot" cx="19" cy="8" r=".45" fill="#C2A17A" style="animation-delay:-0.86s"/><circle class="dust-dot" cx="3.5" cy="12" r=".45" fill="#C2A17A" style="animation-delay:-1.29s"/><circle class="dust-dot" cx="19" cy="18" r=".45" fill="#C2A17A" style="animation-delay:-1.72s"/><circle class="dust-dot" cx="9" cy="20.5" r=".45" fill="#C2A17A" style="animation-delay:-2.15s"/><circle class="dust-dot" cx="13" cy="9.5" r=".45" fill="#C2A17A" style="animation-delay:-2.58s"/><g opacity=".8" transform="translate(1 1) scale(.9)"><g ><path d="M3 8h11a2.5 2.5 0 1 0-2.5-2.5" stroke="#C2A17A" stroke-opacity=".22" stroke-width="1.05" stroke-linecap="round"/><path d="M3 8h11a2.5 2.5 0 1 0-2.5-2.5" stroke="#C2A17A" stroke-width="1.05" stroke-linecap="round" pathLength="36" class="wind-line" style="animation-delay:-0.0s"/><path d="M2.5 12h16a2 2 0 1 0-2-2" stroke="#C2A17A" stroke-opacity=".22" stroke-width="1.05" stroke-linecap="round"/><path d="M2.5 12h16a2 2 0 1 0-2-2" stroke="#C2A17A" stroke-width="1.05" stroke-linecap="round" pathLength="36" class="wind-line alt" style="animation-delay:-1.21s"/><path d="M5 16h9a2.5 2.5 0 1 1-2.5 2.5" stroke="#C2A17A" stroke-opacity=".22" stroke-width="1.05" stroke-linecap="round"/><path d="M5 16h9a2.5 2.5 0 1 1-2.5 2.5" stroke="#C2A17A" stroke-width="1.05" stroke-linecap="round" pathLength="36" class="wind-line" style="animation-delay:-2.42s"/></g></g>
</svg>
