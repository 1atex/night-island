<svg xmlns="http://www.w3.org/2000/svg" class="wx-thunderstorm-snow" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-thunderstorm-snow-title wx-thunderstorm-snow-desc">
<title id="wx-thunderstorm-snow-title">Гроза со снегом</title>
<desc id="wx-thunderstorm-snow-desc">Молния и снег под грозовым облаком.</desc>
<defs><linearGradient id="wx-thunderstorm-snow-bolt" x1="12" y1="13" x2="12" y2="23" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE399"/><stop offset="1" stop-color="#F1B84C"/></linearGradient><linearGradient id="wx-thunderstorm-snow-rim" x1="7.6" y1="5" x2="14" y2="5" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF" stop-opacity="0"/><stop offset=".35" stop-color="#FFF"/><stop offset=".65" stop-color="#FFF"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient><linearGradient id="wx-thunderstorm-snow-cloud-storm" x1="12" y1="2" x2="12" y2="15" gradientUnits="userSpaceOnUse"><stop stop-color="#6A718A"/><stop offset=".55" stop-color="#474F6B"/><stop offset="1" stop-color="#2D344F"/></linearGradient><style>.wx-thunderstorm-snow .cloud-shape{animation:wx-thunderstorm-snow-morph var(--cloud-cycle,15.6s) cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--cloud-phase,0s)}.wx-thunderstorm-snow .cloud-highlight{animation:wx-thunderstorm-snow-highlight var(--cloud-cycle,15.6s) cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--cloud-phase,0s)}.wx-thunderstorm-snow .charged{animation:wx-thunderstorm-snow-morph var(--cloud-cycle,15.6s) cubic-bezier(.45,0,.55,1) infinite,wx-thunderstorm-snow-cloudlight 8.6s ease-in-out infinite;animation-delay:var(--cloud-phase,0s),0s}.wx-thunderstorm-snow .flake{animation:wx-thunderstorm-snow-snow var(--snow-cycle,4.6s) linear infinite}.wx-thunderstorm-snow .bolt{animation:wx-thunderstorm-snow-flash 8.6s ease-in-out infinite}@keyframes wx-thunderstorm-snow-morph{0%,100%{d:path('M6.5 14.5C4.01 14.5 2 12.49 2 10C2 7.7 3.73 5.78 6.07 5.52C6.93 3.32 8.96 1.83 11.25 1.83C14.31 1.83 16.91 4.05 17.3 7C19.95 6.65 21.75 8.4 21.75 10.75C21.75 12.82 20.07 14.5 18 14.5H6.5Z')}34%{d:path('M6.5 14.5C3.94 14.5 1.83 12.47 1.83 10.1C1.83 7.84 3.78 5.61 6.28 5.62C7.12 3.28 9.29 1.63 11.65 1.63C14.61 1.63 16.85 4.11 17.1 7.23C19.64 6.83 21.93 8.49 21.93 10.77C21.93 12.85 20.11 14.5 18 14.5H6.5Z')}68%{d:path('M6.5 14.5C4.