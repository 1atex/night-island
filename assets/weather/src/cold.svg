<svg xmlns="http://www.w3.org/2000/svg" class="wx-cold" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-cold-title wx-cold-desc">
<title id="wx-cold-title">Мороз</title>
<desc id="wx-cold-desc">Голубой термометр и ледяной кристалл.</desc>
<defs><style>.wx-cold .star{animation:wx-cold-twinkle 6.8s ease-in-out infinite}.wx-cold .star.alt{animation-duration:8.1s;animation-delay:-3.7s}.wx-cold .ice{animation:wx-cold-ice 4s ease-in-out infinite}@keyframes wx-cold-twinkle{0%,100%{opacity:.55}50%{opacity:1}}@keyframes wx-cold-ice{0%,100%{opacity:.65}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.wx-cold *{animation:none!important}.wx-cold .drop,.wx-cold .flake,.wx-cold .hail{opacity:.85}.wx-cold .bolt{opacity:1}.wx-cold .wind-line,.wx-cold .funnel-line{stroke-dasharray:none}}</style></defs>
<path d="M10 5a2 2 0 0 1 4 0v9.3a4 4 0 1 1-4 0Z" fill="#EFF6FB" stroke="#9EBBD1" stroke-width=".7" stroke-linejoin="round"/><path d="M12 7v10.3" stroke="#80BCE0" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="18" r="2.25" fill="#80BCE0"/><g transform="translate(19.1 6.2)"><g style="--snow-cycle:4.52s;animation-delay:-0s" class="ice"><path d="M0 -2V2M-1.732 -1.000l3.464 2.000M-1.732 1.000l3.464 -2.000" stroke="#7DBCE2" stroke-width=".43" stroke-linecap="round"/></g></g><g transform="translate(5 10)" class="star"><path d="M0 -0.8V0.8M-0.8 0H0.8" stroke="#98CBE6" stroke-width=".6" stroke-linecap="round"/></g>
</svg>
