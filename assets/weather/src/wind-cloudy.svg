<defs><linearGradient id="wx-wind-cloudy-rim" x1="7.6" y1="5" x2="14" y2="5" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF" stop-opacity="0"/><stop offset=".35" stop-color="#FFF"/><stop offset=".65" stop-color="#FFF"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient><linearGradient id="wx-wind-cloudy-cloud-overcast" x1="12" y1="2" x2="12" y2="15" gradientUnits="userSpaceOnUse"><stop stop-color="#AFB9C6"/><stop offset=".55" stop-color="#8A97A9"/><stop offset="1" stop-color="#69798F"/></linearGradient><style>.wx-wind-cloudy .cloud-shape{animation:wx-wind-cloudy-morph var(--cloud-cycle,15.6s) cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--cloud-phase,0s)}.wx-wind-cloudy .cloud-highlight{animation:wx-wind-cloudy-highlight var(--cloud-cycle,15.6s) cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--cloud-phase,0s)}.wx-wind-cloudy .wind-line{animation:wx-wind-cloudy-flow 3.6s linear infinite;stroke-dasharray:16 20}.wx-wind-cloudy .wind-line.alt{animation-duration:4.7s;animation-delay:-2.1s}@keyframes wx-wind-cloudy-morph{0%,100%{d:path('M6.5 14.5C4.01 14.5 2 12.49 2 10C2 7.7 3.73 5.78 6.07 5.52C6.93 3.32 8.96 1.83 11.25 1.83C14.31 1.83 16.91 4.05 17.3 7C19.95 6.65 21.75 8.4 21.75 10.75C21.75 12.82 20.07 14.5 18 14.5H6.5Z')}34%{d:path('M6.5 14.5C3.94 14.5 1.83 12.47 1.83 10.1C1.83 7.84 3.78 5.61 6.28 5.62C7.12 3.28 9.29 1.63 11.65 1.63C14.61 1.63 16.85 4.11 17.1 7.23C19.64 6.83 21.93 8.49 21.93 10.77C21.93 12.85 20.11 14.5 18 14.5H6.5Z')}68%{d:path('M6.5 14.5C4.04 14.5 2.14 12.51 2.14 9.87C2.14 7.56 3.71 5.98 5.91 5.78C6.66 3.53 8.63 2.03 10.99 2.03C14.14 2.03 16.92 3.91 17.48 6.84C20.02 6.55 21.61 8.33 21.61 10.69C21.61 12.8 20.02 14.5 18 14.5H6.5Z')}}@keyframes wx-wind-cloudy-highlight{0%,100%{d:path('M8.1 6.2C9.02 4.51 11.33 3.61 13.2 4.6')}34%{d:path('M8.36 6.18C9.3 4.32 11.6 3.43 13.48 4.43')}68%{d:path('M7.88 6.36C8.79 4.74 11.1 3.84 12.99 4.76')}}@keyframes wx-wind-cloudy-flow{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.wx-wind-cloudy *{animation:none!important}.wx-wind-cloudy .drop,.wx-wind-cloudy .flake,.wx-wind-cloudy .hail{opacity:.85}.wx-wind-cloudy .bolt{opacity:1}.wx-wind-cloudy .wind-line,.wx-wind-cloudy .funnel-line{stroke-dasharray:none}}</style></defs>
