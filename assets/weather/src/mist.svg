<svg xmlns="http://www.w3.org/2000/svg" class="wx-mist" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-mist-title wx-mist-desc">
<title id="wx-mist-title">Дымка</title>
<desc id="wx-mist-desc">Лёгкая серебристая дымка с плавным движением.</desc>
<defs><linearGradient id="wx-mist-rim" x1="7.6" y1="5" x2="14" y2="5" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF" stop-opacity="0"/><stop offset=".35" stop-color="#FFF"/><stop offset=".65" stop-color="#FFF"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient><linearGradient id="wx-mist-cloud-fog" x1="12" y1="2" x2="12" y2="15" gradientUnits="userSpaceOnUse"><stop stop-color="#E3E5E6"/><stop offset=".55" stop-color="#C9CDCF"/><stop offset="1" stop-color="#ADB4BA"/></linearGradient><style>.wx-mist .cloud-shape{animation:wx-mist-morph var(--cloud-cycle,15.6s) cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--cloud-phase,0s)}.wx-mist .cloud-highlight{animation:wx-mist-highlight var(--cloud-cycle,15.6s) cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--cloud-phase,0s)}.wx-mist .fog-line{animation:wx-mist-mist 8.4s ease-in-out infinite}.wx-mist .fog-line.alt{animation-duration:10.2s;animation-delay:-4.3s}@keyframes wx-mist-morph{0%,100%{d:path('M6.5 14.5C4.01 14.5 2 12.49 2 10C2 7.7 3.73 5.78 6.07 5.52C6.93 3.32 8.96 1.83 11.25 1.83C14.31 1.83 16.91 4.05 17.3 7C19.95 6.65 21.75 8.4 21.75 10.75C21.75 12.82 20.07 14.5 18 14.5H6.5Z')}34%{d:path('M6.5 14.5C3.94 14.5 1.83 12.47 1.83 10.1C1.83 7.84 3.78 5.61 6.28 5.62C7.12 3.28 9.29 1.63 11.65 1.63C14.61 1.63 16.85 4.11 17.1 7.23C19.64 6.83 21.93 8.49 21.93 10.77C21.93 12.85 20.11 14.5 18 14.5H6.5Z')}68%{d:path('M6.5 14.5C4.04 14.5 2.14 12.51 2.14 9.87C2.14 7.56 3.71 5.98 5.91 5.78C6.66 3.53 8.63 2.03 10.99 2.03C14.14 2.03 16.92 3.91 17.48 6.84C20.02 6.55 21.61 8.33 21.61 10.69C21.61 12.8 20.02 14.5 18 14.5H6.5Z')}}@keyframes wx-mist-highlight{0%,100%{d:path('M8.1 6.2C9.02 4.51 11.33 3.61 13.2 4.6')}34%{d:path('M8.36 6.18C9.3 4.32 11.6 3.43 13.48 4.43')}68%{d:path('M7.88 6.36C8.79 4.74 11.1 3.84 12.99 4.76')}}@keyframes wx-mist-mist{0%,100%{transform:translateX(-.5px);opacity:.6}50%{transform:translateX(.7px);opacity:.95}}@media(prefers-reduced-motion:reduce){.wx-mist *{animation:none!important}.wx-mist .drop,.wx-mist .flake,.wx-mist .hail{opacity:.85}.wx-mist .bolt{opacity:1}.wx-mist .wind-line,.wx-mist .funnel-line{stroke-dasharray:none}}</style></defs>
<g opacity=".55" transform="translate(3 3) scale(.75)"><g style="--cloud-cycle:19.12s;--cloud-phase:-12.56s" class="cloud"><path d="M6.5 14.5C4.01 14.5 2 12.49 2 10C2 7.7 3.73 5.78 6.07 5.52C6.93 3.32 8.96 1.83 11.25 1.83C14.31 1.83 16.91 4.05 17.3 7C19.95 6.65 21.75 8.4 21.75 10.75C21.75 12.82 20.07 14.5 18 14.5H6.5Z" fill="url(#wx-mist-cloud-fog)" stroke="#A1AEB7" stroke-width=".5" stroke-linejoin="round" class="cloud-shape"/><path d="M8.1 6.2C9.02 4.51 11.33 3.61 13.2 4.6" stroke="url(#wx-mist-rim)" stroke-opacity=".45" stroke-width=".5" stroke-linecap="round" class="cloud-highlight"/></g></g><path d="M5 15H18" stroke="#B9CDD9" stroke-width=".95" stroke-linecap="round" class="fog-line"/><path d="M3 18H20" stroke="#B9CDD9" stroke-width=".95" stroke-linecap="round" class="fog-line alt"/><path d="M7 21H17" stroke="#B9CDD9" stroke-width=".95" stroke-linecap="round" class="fog-line"/>
</svg>
