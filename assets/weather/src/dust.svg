<svg xmlns="http://www.w3.org/2000/svg" class="wx-dust" width="128" height="128" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="wx-dust-title wx-dust-desc">
<title id="wx-dust-title">Пыль</title>
<desc id="wx-dust-desc">Песочные линии и пылинки плывут в воздухе.</desc>
<defs><style>.wx-dust .fog-line{animation:wx-dust-mist 8.4s ease-in-out infinite}.wx-dust .fog-line.alt{animation-duration:10.2s;animation-delay:-4.3s}.wx-dust .dust-dot{animation:wx-dust-dust 3.8s ease-in-out infinite}@keyframes wx-dust-mist{0%,100%{transform:translateX(-.5px);opacity:.6}50%{transform:translateX(.7px);opacity:.95}}@keyframes wx-dust-dust{0%{opacity:0;transform:translate(-1px,.4px)}25%,70%{opacity:.8}100%{opacity:0;transform:translate(2px,-.4px)}}@media(prefers-reduced-motion:reduce){.wx-dust *{animation:none!important}.wx-dust .drop,.wx-dust .flake,.wx-dust .hail{opacity:.85}.wx-dust .bolt{opacity:1}.wx-dust .wind-line,.wx-dust .funnel-line{stroke-dasharray:none}}</style></defs>
<path d="M3 9H17" stroke="#C2A17A" stroke-width=".95" stroke-linecap="round" class="fog-line"/><path d="M6 13H21" stroke="#C2A17A" stroke-width=".95" stroke-linecap="round" class="fog-line alt"/><path d="M3 17H16" stroke="#C2A17A" stroke-width=".95" stroke-linecap="round" class="fog-line"/><circle class="dust-dot" cx="5" cy="5" r=".45" fill="#C2A17A" style="animation-delay:-0.0s"/><circle class="dust-dot" cx="14" cy="5.5" r=".45" fill="#C2A17A" style="animation-delay:-0.43s"/><circle class="dust-dot" cx="19" cy="8" r=".45" fill="#C2A17A" style="animation-delay:-0.86s"/><circle class="dust-dot" cx="3.5" cy="12" r=".45" fill="#C2A17A" style="animation-delay:-1.29s"/><circle class="dust-dot" cx="19" cy="18" r=".45" fill="#C2A17A" style="animation-delay:-1.72s"/><circle class="dust-dot" cx="9" cy="20.5" r=".45" fill="#C2A17A" style="animation-delay:-2.15s"/><circle class="dust-dot" cx="13" cy="9.5" r=".45" fill="#C2A17A" style="animation-delay:-2.58s"/>
</svg>
