    <rect x="46" y="126" width="16" height="20" rx="8" fill="url(#bar)"/>
    <rect x="70" y="112" width="16" height="48" rx="8" fill="url(#bar)"/>
    <rect x="94" y="100" width="16" height="72" rx="8" fill="url(#bar)"/>
    <rect x="118" y="108" width="16" height="56" rx="8" fill="url(#bar)"/>
    <rect x="142" y="96" width="16" height="80" rx="8" fill="url(#bar)"/>
    <rect x="166" y="114" width="16" height="44" rx="8" fill="url(#bar)"/>
