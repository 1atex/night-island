<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Night Island</title>
  <defs>
    <linearGradient id="skyd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17153a"/><stop offset="1" stop-color="#3a3068"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1840"/><stop offset="0.55" stop-color="#46396f"/><stop offset="1" stop-color="#9a768f"/></linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6ecd2"/><stop offset="1" stop-color="#dcc796"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e8cc"/><stop offset="1" stop-color="#9f94cc"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8a9e0"/><stop offset="1" stop-color="#6f649f"/></linearGradient>
    <clipPath id="cw"><rect x="32" y="84" width="192" height="88" rx="44"/></clipPath>
    <mask id="mc" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><rect width="256" height="256" fill="#fff"/><circle cx="141" cy="46" r="19" fill="#000"/></mask>
  </defs>
  <rect x="6" y="6" width="244" height="244" rx="64" fill="url(#skyd)"/>
  <rect x="6" y="6" width="244" height="244" rx="64" fill="none" stroke="url(#rim)" stroke-width="6" opacity=".7"/>
  <circle cx="128" cy="50" r="40" fill="#f6ecd2" opacity=".1"/>
  <circle cx="128" cy="50" r="24" fill="url(#moon)" mask="url(#mc)"/>
  <circle cx="52" cy="48" r="2.5" fill="#f6ecd2"/><circle cx="204" cy="60" r="2.5" fill="#f6ecd2"/><circle cx="84" cy="30" r="2" fill="#f6ecd2"/>
